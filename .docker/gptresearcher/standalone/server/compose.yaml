services:
  server:
    image: ranktotop/openwebui:gptresearcher-standalone-latest
    # Settings. See here https://docs.gptr.dev/docs/gpt-researcher/gptr/config
    environment: 
      # General
      LOGGING_LEVEL: ${LOGGING_LEVEL:-INFO}
      LANGUAGE: ${LANGUAGE:-german}
      REPORT_SOURCE: ${REPORT_SOURCE:-web}
      SCRAPER: ${SCRAPER:-bs} # beautiful soup by default
      # External APIs
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      RETRIEVER: searx
      SEARX_URL: ${SEARX_URL}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      # Images
      IMAGE_GENERATION_ENABLED: ${IMAGE_GENERATION_ENABLED:-false}
      IMAGE_GENERATION_MODEL: ${IMAGE_GENERATION_MODEL:-gemini-2.5-flash-image}
      IMAGE_GENERATION_MAX_IMAGES: ${IMAGE_GENERATION_MAX_IMAGES:-3}
      # Models
      EMBEDDING: ${EMBEDDING:-text-embedding-3-small} # e.g: ollama:nomic-embed-text
      FAST_LLM: ${FAST_LLM:-gpt-4o-mini} # e.g: litellm:perplexity/pplx-7b-chat
      SMART_LLM: ${SMART_LLM:-gpt-4.1}
      STRATEGIC_LLM: ${STRATEGIC_LLM:-o4-mini}
      # Deep Research
      DEEP_RESEARCH_BREADTH: ${DEEP_RESEARCH_BREADTH:-4}
      DEEP_RESEARCH_DEPTH: ${DEEP_RESEARCH_DEPTH:-2}
      DEEP_RESEARCH_CONCURRENCY: ${DEEP_RESEARCH_CONCURRENCY:-1}
      TOTAL_WORDS: ${TOTAL_WORDS:-2500}
      # Others
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.42}
      CURATE_SOURCES: ${CURATE_SOURCES:-false}
      FAST_TOKEN_LIMIT: ${FAST_TOKEN_LIMIT:-2000}
      SMART_TOKEN_LIMIT: ${SMART_TOKEN_LIMIT:-4000}
      STRATEGIC_TOKEN_LIMIT: ${STRATEGIC_TOKEN_LIMIT:-4000}
      BROWSE_CHUNK_MAX_LENGTH: ${BROWSE_CHUNK_MAX_LENGTH:-8192}
      SUMMARY_TOKEN_LIMIT: ${SUMMARY_TOKEN_LIMIT:-700}
      TEMPERATURE: ${TEMPERATURE:-0.4}
      # Files
      DOC_PATH: ${DOC_PATH:-./my-docs}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      default:
        aliases:
          - gptresearcher-server
    ports:
      - ${GPTRESEARCHER_SERVER_PORT:-8000}:8000
      
  ui:
    image: ranktotop/openwebui:gptresearcher-standalone-ui-latest
    environment:
      # General
      LOGGING_LEVEL: ${LOGGING_LEVEL:-INFO}
      CHOKIDAR_USEPOLLING: "true"
      NEXT_PUBLIC_GPTR_API_URL: ${NEXT_PUBLIC_GPTR_API_URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      server:
        condition: service_healthy
    networks:
      default:
        aliases:
          - gptresearcher-ui
    ports:
      - ${GPTRESEARCHER_UI_PORT:-3000}:3000

networks:
  default: